[package]
name = "bevy_panorbit_camera"
version = "0.29.0"
authors = ["Plonq"]
edition = "2024"
description = "A basic pan and orbit camera in Bevy"
keywords = ["gamedev", "bevy", "orbit", "camera"]
categories = ["game-development"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonq/bevy_panorbit_camera"
homepage = "https://github.com/Plonq/bevy_panorbit_camera"
readme = "README.md"

[features]
bevy_egui = ["dep:bevy_egui"]

[dependencies]
bevy = { version = "0.17.0-dev", git = "https://github.com/bevyengine/bevy.git",  default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_window",
] }
bevy_egui = {git = "https://github.com/MiniMinerX/bevy_egui", branch = "dev-0.17", optional = true, default-features = false }

[dev-dependencies]
bevy = { version = "0.17.0-dev", git = "https://github.com/bevyengine/bevy.git"}
float-cmp = "0.10.0"
bevy_egui = {git = "https://github.com/MiniMinerX/bevy_egui", branch = "dev-0.17", default-features = false, features = [
    "render",
    "default_fonts",
] }

[[example]]
name = "egui"
required-features = ["bevy_egui"]

[[example]]
name = "egui_multiple_windows"
required-features = ["bevy_egui"]
